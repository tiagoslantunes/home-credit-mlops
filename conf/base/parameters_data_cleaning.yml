# Parameters for the 'data_cleaning' pipeline (application_train).
#
# Decisions follow analises.ipynb. Crucially, every drop list and every
# imputation value is LEARNED ON THE TRAIN SPLIT (data_cleaning.fit_cleaning)
# and persisted to `cleaning_params`; apply_cleaning then replays exactly the
# same transformation on the validation split and on any future batch, so no
# statistic is ever computed on data the model will be evaluated/served on.
data_cleaning:
  id_columns:
    - SK_ID_CURR
  target_column: TARGET

  # --- structural feature drops (thresholds applied on the TRAIN split) ---
  missing_threshold: 0.45        # drop columns with > 45% missing values
  corr_threshold: 0.9            # of each |r| > 0.9 numeric pair, drop the 2nd column
  near_constant_threshold: 0.95  # drop columns whose dominant value covers >= 95% of non-nulls

  # --- DAYS_EMPLOYED sentinel handling (correct-methodology addition, not in analises.ipynb) ---
  # 365243 is a placeholder ("not employed", ~18% of rows). Kept as a real value it
  # poisons the distribution, so it is turned into NaN + a binary missingness flag and
  # then imputed with the train median like any other numeric column.
  days_employed_col: DAYS_EMPLOYED
  days_employed_flag: DAYS_EMPLOYED_ANOM
  days_employed_sentinel: 365243

  # --- imputation strategies (analises.ipynb) ---
  # Filled with 0: absence of a bureau/social-circle record is semantically zero events.
  zero_fill_cols:
    - AMT_REQ_CREDIT_BUREAU_MON
    - AMT_REQ_CREDIT_BUREAU_QRT
    - AMT_REQ_CREDIT_BUREAU_YEAR
    - OBS_30_CNT_SOCIAL_CIRCLE
    - DEF_30_CNT_SOCIAL_CIRCLE
    - DEF_60_CNT_SOCIAL_CIRCLE
  # Numeric columns imputed with the train median (listed for documentation + drop protection).
  median_fill_cols:
    - AMT_ANNUITY
    - EXT_SOURCE_2
    - EXT_SOURCE_3
    - DAYS_EMPLOYED
  # Integer-count columns -> train median rounded to the nearest integer (keeps the dtype meaningful).
  median_int_cols:
    - CNT_FAM_MEMBERS
    - DAYS_LAST_PHONE_CHANGE
  # Categorical columns where missingness is itself a signal -> explicit new category.
  constant_fill:
    OCCUPATION_TYPE: Unknown
  # Conceptually-integer columns (counts / days) that pandas promoted to float because
  # they held NaN/sentinels before imputation. With no NaN left they are rounded and
  # cast back to int64 at the end of apply_cleaning, so the dtype matches the meaning.
  cast_int_cols:
    - DAYS_EMPLOYED
    - DAYS_REGISTRATION
    - OBS_30_CNT_SOCIAL_CIRCLE
    - DEF_30_CNT_SOCIAL_CIRCLE
    - OBS_60_CNT_SOCIAL_CIRCLE
    - DEF_60_CNT_SOCIAL_CIRCLE
    - AMT_REQ_CREDIT_BUREAU_MON
    - AMT_REQ_CREDIT_BUREAU_QRT
    - AMT_REQ_CREDIT_BUREAU_YEAR
  # Every OTHER column is handled by the generic production fallback in apply_cleaning:
  #   numeric  -> train median   (e.g. NAME_TYPE_SUITE-style numerics)
  #   categorical -> train mode   (e.g. NAME_TYPE_SUITE -> "Unaccompanied")
  # This guarantees a batch/serving frame is never left with NaNs, even for columns
  # not explicitly enumerated above.

  # --- defensive value capping (production safeguard) ---
  # Clip numeric columns to the EDA-derived min/max bounds from the data-quality
  # rules (params:numerical_rules). The train split is already gated by data_quality,
  # so this only ever bites on drifted validation/batch values.
  apply_value_bounds: true
