# ==================
# DATA SPLIT OUTPUTS
# ==================
# Stratified 80/20 split of application_train, produced BEFORE cleaning so that
# all imputation statistics are fit on the train partition only.
# save_args index:false avoids writing the row index back as an "Unnamed: 0"
# column (Kedro reloads CSV from disk between nodes).

application_train_split:
  type: pandas.CSVDataset
  filepath: data/02_intermediate/application_train_split.csv
  save_args:
    index: false

application_validation_split:
  type: pandas.CSVDataset
  filepath: data/02_intermediate/application_validation_split.csv
  save_args:
    index: false


# =====================
# DATA CLEANING OUTPUTS
# =====================
# cleaning_params is the fit-on-train artifact (drop lists + imputation
# statistics + value bounds), reused to clean the validation split and any
# future serving batch identically. It is a dict, so it stays pickle.

cleaning_params:
  type: pickle.PickleDataset
  filepath: data/04_feature/cleaning_params.pkl

application_train_cleaned:
  type: pandas.CSVDataset
  filepath: data/03_primary/application_train_cleaned.csv
  save_args:
    index: false

application_validation_cleaned:
  type: pandas.CSVDataset
  filepath: data/03_primary/application_validation_cleaned.csv
  save_args:
    index: false

# Production/holdout batch: cleaned straight from raw with the train-fit artifact.
application_test_cleaned:
  type: pandas.CSVDataset
  filepath: data/03_primary/application_test_cleaned.csv
  save_args:
    index: false
    
    # ── 04_feature ────────────────────────────────────────────────────────────────
# Outputs of create_features node (engineered, before feature selection)

application_train_features:
  type: pandas.CSVDataset
  filepath: data/04_feature/application_train_features.csv

application_validation_features:
  type: pandas.CSVDataset
  filepath: data/04_feature/application_validation_features.csv

application_test_features:
  type: pandas.CSVDataset
  filepath: data/04_feature/application_test_features.csv


# ── 05_model_input ────────────────────────────────────────────────────────────
# Outputs of select_features node (RFE-selected, X/y split, ready for model)
# y_test does not exist — test split has no ground-truth labels

X_train_data:
  type: pandas.CSVDataset
  filepath: data/05_model_input/X_train.csv

y_train_data:
  type: pandas.CSVDataset
  filepath: data/05_model_input/y_train.csv

X_val_data:
  type: pandas.CSVDataset
  filepath: data/05_model_input/X_val.csv

y_val_data:
  type: pandas.CSVDataset
  filepath: data/05_model_input/y_val.csv

X_test_data:
  type: pandas.CSVDataset
  filepath: data/05_model_input/X_test.csv


# ── 06_models ────────────────────────────────────────────────────────────────

best_columns:
  type: kedro_mlflow.io.artifacts.MlflowArtifactDataset
  dataset:
    type: pickle.PickleDataset
    filepath: data/06_models/best_cols.pkl

production_columns:
  type: kedro_mlflow.io.artifacts.MlflowArtifactDataset
  dataset:
    type: pickle.PickleDataset
    filepath: data/06_models/production_cols.pkl

production_model:
  type: kedro_mlflow.io.artifacts.MlflowArtifactDataset
  dataset:
    type: pickle.PickleDataset
    filepath: data/06_models/production_model.pkl

# Melhores hiperparâmetros selecionados por model_selection (GridSearch+Optuna)
best_params:
  type: json.JSONDataset
  filepath: data/06_models/best_params.json

# Threshold de probabilidade selecionado para produção
decision_threshold:
  type: json.JSONDataset
  filepath: data/06_models/decision_threshold.json

# ── 08_reporting ─────────────────────────────────────────────────────────────

# Painel de métricas do modelo de produção (ROC-AUC, Gini, KS, PR-AUC, Brier…)
model_metrics:
  type: json.JSONDataset
  filepath: data/08_reporting/production_model_metrics.json

# Importâncias SHAP globais (feature, mean_abs_shap)
shap_importance:
  type: pandas.CSVDataset
  filepath: data/08_reporting/shap_importance.csv
  save_args:
    index: false


