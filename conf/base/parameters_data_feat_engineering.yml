# Feature Engineering 

data_feat_engineering:
  target_column: TARGET
  id_column: SK_ID_CURR

  # EXT_SOURCE columns to aggregate. EXT_SOURCE_1 was dropped by data_cleaning
  # only EXT_SOURCE_2 and EXT_SOURCE_3 exist in 03_primary.
  # The node uses avail = [c for c in ext_source_cols if c in df.columns] so
  # listing EXT_SOURCE_1 here is harmless but kept for documentation.
  ext_source_cols:
    - EXT_SOURCE_1
    - EXT_SOURCE_2
    - EXT_SOURCE_3

  # Binary categorical encoding
  # CODE_GENDER has 3 values so it goes through OHE instead.
  # Only truly binary columns (Y/N, no unknowns) belong here.
  binary_map:
    FLAG_OWN_CAR:
      N: 0
      Y: 1
    FLAG_OWN_REALTY:
      N: 0
      Y: 1

  # One-hot encoding (applied to categoricals with ≤ threshold unique values)
  ohe_cardinality_threshold: 10

  # Smoothed cross-validated target encoding (high-cardinality categoricals)
  target_encoding_cols:
    - OCCUPATION_TYPE
    - ORGANIZATION_TYPE
  target_encoding_smoothing: 10
  target_encoding_n_folds: 5
  target_encoding_random_state: 42

  # Feature Selection — RFE 
  # Use RFE sklearn RFE with RandomForest base estimator.
  # RFE recursively removes the least important features until n_features_to_select
  # remain. Fitted on training data only — validation and test never influence selection.
  feature_selection_method: rfe
  n_features_to_select: 50
  rfe_step: 5

  rfe_estimator_params:
    n_estimators: 100
    max_depth: 5
    random_state: 42
    n_jobs: -1

  # Hopsworks Feature Store 
  # Credentials are read from .env (HOPSWORKS_API_KEY, HOPSWORKS_PROJECT).
  # The pipeline continues without error if the key is absent.
  hopsworks_project: home_credit_mlops
  hopsworks_feature_group_name: home_credit_features
  hopsworks_feature_group_version: 1
  hopsworks_feature_view_name: home_credit_feature_view
  hopsworks_feature_view_version: 1
  hopsworks_host: "eu-west.cloud.hopsworks.ai"
  # Set to true once the feature group schema is stable in Hopsworks EU-West.
  enable_feature_view: true
  # Set to true to trigger Hopsworks statistics computation after upload.
  enable_statistics: true
