[build-system]
requires = [
    "setuptools",
]
build-backend = "setuptools.build_meta"

[project]
requires-python = ">=3.12"
name = "home_credit_mlops"
description = "End-to-end MLOps pipeline for Home Credit default-risk modelling"
readme = "README.md"
authors = [
    { name = "Alexandra Varela" },
    { name = "Francisca Fernandes" },
    { name = "Mariana Melo" },
    { name = "Rui Ferreira" },
    { name = "Tiago Antunes" },
]
keywords = ["credit-risk", "kedro", "machine-learning", "mlflow", "mlops"]
dynamic = [
    "version",
]
dependencies = [
    "kedro~=1.4.0",
    "numpy>=2.3,<3",
    "pandas>=2.3,<2.4",
    "scikit-learn>=1.9,<2",
]

[project.scripts]
home-credit-mlops = "home_credit_mlops.__main__:main"

[project.entry-points."kedro.hooks"]

[project.optional-dependencies]
dev = [
    "pytest-cov>=3,<7",
    "pytest-mock>=1.7.1, <2.0",
    "pytest~=7.2",
    "ruff~=0.12.0",
]
notebooks = [
    "ipython>=8.10",
    "jupyterlab>=3.0",
    "notebook",
]

[project.urls]
Repository = "https://github.com/tiagoslantunes/home-credit-mlops"
Upstream = "https://github.com/marianamelo0/home-credit-mlops"
"Model card" = "https://github.com/tiagoslantunes/home-credit-mlops/blob/main/MODEL_CARD.md"

[tool.setuptools.dynamic.version]
attr = "home_credit_mlops.__version__"

[tool.setuptools.packages.find]
where = [
    "src",
]
namespaces = false

[tool.kedro]
package_name = "home_credit_mlops"
project_name = "home-credit-mlops"
kedro_init_version = "1.4.0"
tools = "['Linting', 'Testing', 'Custom Logging', 'Data Structure']"
example_pipeline = "False"
source_dir = "src"

[tool.pytest.ini_options]
addopts = "--cov-report term-missing --cov src/home_credit_mlops -ra"

[tool.coverage.report]
fail_under = 0
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 88
show-fixes = true

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = [
    "F",
    "W",
    "E",
    "I",
    "UP",
    "PL",
    "T201",
]
ignore = [
    "E501",
]

[tool.kedro_telemetry]
project_id = "e897d1db84184e61a021dc7ca508a0ce"
