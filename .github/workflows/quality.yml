name: Quality checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MPLBACKEND: Agg
      MLFLOW_ALLOW_FILE_STORE: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt
          python -m pip install --no-deps -e .

      - name: Check Python syntax
        run: python -m compileall -q app src tests

      - name: Validate notebook JSON
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          notebooks = sorted(Path("notebooks").glob("*.ipynb"))
          for path in notebooks:
              json.loads(path.read_text(encoding="utf-8"))
          print(f"Validated {len(notebooks)} notebooks")
          PY

      - name: Run data-independent tests
        run: >-
          python -m pytest -q --no-cov tests
          --ignore=tests/app
          -k "not TestToFeatureStoreHopsworks"
